<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1326"><title>Gjett bedriften</title><meta name="description" content="Hvor godt kjenner du bedriftene?"><link rel="stylesheet" href="style.css"></head><body><div class="ambient one"></div><div class="ambient two"></div><main class="shell">
<header class="topbar"><a class="brand" href="#"><span class="brand-mark">G</span><span>Gjett bedriften</span></a><div class="record">🏆 Rekord: <strong id="record">0</strong></div></header>
<section id="start" class="screen active"><div class="eyebrow">NORSK BEDRIFTSQUIZ</div><h1>Hvor godt kjenner du<br><span>bedriftene?</span></h1><p class="intro">Se logoer, kategorier og ledetråder. Velg riktig bedrift før tiden går ut.</p><div class="mode-grid"><button class="mode selected" data-mode="mixed"><span class="mode-icon">✦</span><b>Blandet</b><small>Alle typer spørsmål</small></button><button class="mode" data-mode="logo"><span class="mode-icon">◉</span><b>Gjett logoen</b><small>Hvilken bedrift er dette?</small></button><button class="mode" data-mode="category"><span class="mode-icon">▦</span><b>Gjett kategorien</b><small>Hvem passer beskrivelsen?</small></button><button class="mode" data-mode="clue"><span class="mode-icon">❝</span><b>Gjett ledetråden</b><small>Finn bedriften fra omtalen</small></button></div><div class="round-options"><span>Antall spørsmål</span><div><button data-count="5">5</button><button class="selected" data-count="10">10</button><button data-count="15">15</button></div></div><button id="play" class="primary">Start spillet <span>→</span></button><p class="database"><span></span><strong id="companyCount">0</strong> bedrifter i spillet</p></section>
<section id="game" class="screen"><div class="game-head"><button id="quit" class="icon-btn">×</button><div class="progress-wrap"><div class="progress-text"><span id="questionNumber"></span><span id="scoreTop"></span></div><div class="progress"><i id="progressBar"></i></div></div></div><div class="stats"><div><small>TID</small><strong id="timer">15</strong></div><div><small>STREAK</small><strong id="streak">🔥 0</strong></div><div><small>POENG</small><strong id="score">0</strong></div></div><article class="question-card"><span id="questionType" class="tag"></span><div id="visual" class="visual"></div><h2 id="question"></h2><p id="subquestion"></p><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="next" class="primary hidden">Neste spørsmål <span>→</span></button></article></section>
<section id="result" class="screen result"><div id="resultEmoji" class="result-emoji">🏆</div><div class="eyebrow">RUNDE FULLFØRT</div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-score"><strong id="finalScore">0</strong><span>POENG</span></div><div class="result-grid"><div><b id="correctCount">0</b><small>Riktige</small></div><div><b id="bestStreak">0</b><small>Beste streak</small></div><div><b id="accuracy">0%</b><small>Treffsikkerhet</small></div></div><button id="again" class="primary">Spill igjen <span>↻</span></button></section>
</main><script src="app.js"></script></body></html>
